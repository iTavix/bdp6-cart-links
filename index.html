<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrello BDP Serie 6</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0071e3">
<style>
  :root {
    --bg: #f5f5f7;
    --text: #1d1d1f;
    --text2: #6e6e73;
    --accent: #0071e3;
    --accent-text: #ffffff;
    --glass: rgba(255, 255, 255, 0.62);
    --glass-strong: rgba(255, 255, 255, 0.8);
    --glass-border: rgba(0, 0, 0, 0.08);
    --hairline: rgba(0, 0, 0, 0.1);
    --link: #7a4d00;
    --linkbox-bg: rgba(255, 255, 255, 0.55);
    --green: #248a3d;
    --red: #d70015;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --blob-opacity: 0.5;
  }
  html[data-theme="dark"] {
    --bg: #0d0d0f;
    --text: #f5f5f7;
    --text2: #98989d;
    --accent: #2997ff;
    --accent-text: #ffffff;
    --glass: rgba(28, 28, 30, 0.55);
    --glass-strong: rgba(44, 44, 46, 0.7);
    --glass-border: rgba(255, 255, 255, 0.1);
    --hairline: rgba(255, 255, 255, 0.14);
    --link: #ffd60a;
    --linkbox-bg: rgba(0, 0, 0, 0.35);
    --green: #30d158;
    --red: #ff453a;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --blob-opacity: 0.25;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 16px 0;
    transition: background 0.3s, color 0.3s;
    overflow-x: hidden;
  }
  .blobs { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: var(--blob-opacity); }
  .blob.b1 { width: 420px; height: 420px; background: #ffd60a; top: -120px; left: -100px; }
  .blob.b2 { width: 480px; height: 480px; background: #64b5ff; top: 30%; right: -160px; }
  .blob.b3 { width: 380px; height: 380px; background: #ff6961; bottom: -120px; left: 20%; }

  .wrap { max-width: 640px; margin: 0 auto; }

  .topbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
  .seg {
    display: flex; border-radius: 999px; padding: 2px;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }
  .seg button {
    border: none; background: transparent; color: var(--text2);
    font: 600 13px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .theme-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--glass); border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  .seg button:focus-visible, .theme-btn:focus-visible,
  .set-card:focus-visible, select:focus-visible, .btn:focus-visible, .mini-btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  header { margin-bottom: 22px; }
  .head-row { display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 40px; font-weight: 800; letter-spacing: 1px; line-height: 1; }
  .serie-title { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; margin-top: 10px; }
  header .sub { color: var(--text2); font-size: 13px; margin-top: 3px; }
  header .note { color: var(--text2); font-size: 12px; margin-top: 2px; font-style: italic; }
  .brand-logo { height: 60px; width: auto; display: block; }
  .logo-link { flex-shrink: 0; border-radius: 8px; }
  .logo-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (max-width: 520px) {
    header h1 { font-size: 32px; }
    .brand-logo { height: 48px; }
  }

  .step-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .restore-btn {
    background: none; border: none; padding: 0;
    font-size: 12px; font-weight: 600; font-family: inherit; color: var(--accent);
    cursor: pointer; flex-shrink: 0;
  }
  .restore-btn[hidden] { display: none; }

  .step-label {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text2);
    margin: 20px 0 8px;
  }

  .glass-panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: var(--shadow);
  }

  .sets { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .sets { grid-template-columns: 1fr; } }
  .set-item { display: flex; flex-direction: column; gap: 6px; }
  .set-fields { display: flex; gap: 6px; }
  .set-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    padding: 12px 14px;
    cursor: pointer;
    text-align: left;
    color: var(--text);
    font: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  .set-card:hover { transform: translateY(-1px); }
  .set-card.active {
    border-color: var(--accent);
    background: var(--glass-strong);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .set-card .code { font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
  .set-card .name { font-size: 13px; margin-top: 2px; }
  .set-card .price { font-size: 12px; color: var(--text2); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .set-card.active .code { color: var(--accent); }
  .code-input, .name-input {
    padding: 8px 10px; font: 600 13px/1.2 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    background: var(--glass); color: var(--text); border: 1px solid var(--glass-border);
    border-radius: 10px; outline: none;
  }
  .code-input { flex: 0 0 104px; min-width: 0; }
  .name-input { flex: 1; min-width: 0; font-family: inherit; font-weight: 500; }
  .code-input:focus, .name-input:focus { border-color: var(--accent); }
  .code-input.invalid, .name-input.invalid { border-color: var(--red); }

  select {
    width: 100%; padding: 13px 14px; font-size: 16px;
    background-color: var(--glass); color: var(--text);
    border: 1px solid var(--glass-border); border-radius: 14px;
    outline: none; cursor: pointer;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    -webkit-appearance: none; appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'%3E%3Cpath d='M1 1l6 6 6-6' stroke='%23888890' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }
  select:focus { border-color: var(--accent); }

  .result { margin-top: 22px; padding: 16px; display: none; }
  .result.show { display: block; }
  .result .head { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .result .head span { color: var(--accent); }
  .linkbox {
    background: var(--linkbox-bg);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 13px;
    word-break: break-all;
    color: var(--text);
    user-select: all;
    -webkit-user-select: all;
  }
  .btns { display: flex; gap: 10px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 13px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer;
    font-family: inherit;
    transition: transform 0.05s, filter 0.15s;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; text-align: center;
  }
  .btn:active { transform: scale(0.97); }
  .btn:hover { filter: brightness(1.05); }
  .btn-copy { background: var(--accent); color: var(--accent-text); }
  .btn-copy.copied { background: var(--green); color: #fff; }
  .btn-open {
    background: var(--glass-strong); color: var(--text);
    border: 1px solid var(--glass-border);
  }

  .all-sets { margin-top: 22px; display: none; }
  .all-sets.show { display: block; }
  .all-sets h2 { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.2px; }
  .mini-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
    margin-bottom: 7px;
  }
  .mini-row .info { flex: 1; min-width: 0; }
  .mini-row .t { font-size: 13px; font-weight: 600; }
  .mini-row .u {
    font-size: 11px; color: var(--text2);
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini-btn {
    padding: 8px 16px; font-size: 13px; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 999px;
    cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .mini-btn.copied { background: var(--green); color: #fff; }

  footer {
    margin: 28px 0 0; text-align: center; color: var(--text2); font-size: 12.5px;
    padding: 18px 0 24px;
  }
  footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }
</style>
</head>

    allTitle: 'Tutti i set Serie 6 per lo store selezionato',
    copyAll: '📋 Copia tutti e 5 (nome + link)',
    copyMini: 'Copia',
    codeLabel: 'Codice prodotto',
    nameLabel: 'Nome del set',
    codePh: 'Codice',
    namePh: 'Nome',
    restore: '\u21ba Ripristina',
    manualCopy: 'Copia manualmente il link:',
    footer: 'Creata con amore da <a href="https://www.instagram.com/itavix_bricks/" target="_blank" rel="noopener">iTavix</a> e Claude',
  },
  en: {
    title: 'Series 6 — Direct link to the LEGO Cart',
    subtitle: 'Pick a set and a store: the link adds the set straight to your cart',
    loginNote: '(you must already be signed in to the LEGO shop where you’ll make the purchase)',
    step1: '1 · Pick the set',
    step2: '2 · Pick the store',
    selectStore: '— select a store —',
    copy: '📋 Copy link',
    copied: '✓ Copied!',
    open: 'Open ↗',
    allTitle: 'All Series 6 sets for the selected store',
    copyAll: '📋 Copy all 5 (name + link)',
    copyMini: 'Copy',
    codeLabel: 'Product code',
    nameLabel: 'Set name',
    codePh: 'Code',
    namePh: 'Name',
    restore: '\u21ba Reset',
    manualCopy: 'Copy the link manually:',
    footer: 'Made with love by <a href="https://www.instagram.com/itavix_bricks/" target="_blank" rel="noopener">iTavix</a> and Claude',
  },
};

const SETS_DEFAULT = SETS.map(s => ({ code: s.code, name: s.name }));

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  remove(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let lang = store.get('bdp6-lang') || 'it';

// I set modificati a mano restano salvati fino al ripristino
function isEdited() {
  return SETS.some((s, i) => s.code !== SETS_DEFAULT[i].code || s.name !== SETS_DEFAULT[i].name);
}
function saveSets() {
  if (isEdited()) store.set('bdp6-sets', JSON.stringify(SETS.map(s => ({ code: s.code, name: s.name }))));
  else store.remove('bdp6-sets');
  $('restoreBtn').hidden = !isEdited();
}
function loadSets() {
  let saved;
  try { saved = JSON.parse(store.get('bdp6-sets')); } catch (e) { return; }
  if (!Array.isArray(saved) || saved.length !== SETS.length) return;
  saved.forEach((v, i) => {
    if (v && typeof v.code === 'string') SETS[i].code = v.code;
    if (v && typeof v.name === 'string') SETS[i].name = v.name;
  });
}
loadSets();
let selectedCode = null;
const t = key => I18N[lang][key];

// --- theme ---
function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  $('themeBtn').textContent = mode === 'dark' ? '☀️' : '🌙';
  store.set('bdp6-theme', mode);
}
$('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
};

// --- language ---
function applyLang(l) {
  lang = l;
  store.set('bdp6-lang', l);
  document.documentElement.lang = l;
  $('langIt').classList.toggle('on', l === 'it');
  $('langEn').classList.toggle('on', l === 'en');
  $('serieTitle').textContent = t('title');
  $('subtitle').textContent = t('subtitle');
  $('loginNote').textContent = t('loginNote');
  $('step1').textContent = t('step1');
  $('step2').textContent = t('step2');
  $('footer').innerHTML = t('footer');
  $('restoreBtn').textContent = t('restore');
  refreshSetLabels();
  buildStoreSelect();
  update();
}
$('langIt').onclick = () => applyLang('it');
$('langEn').onclick = () => applyLang('en');

// --- set cards ---
const setRows = [];
SETS.forEach(s => {
  const item = document.createElement('div');
  item.className = 'set-item';

  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'set-card';
  b.innerHTML = '<div class="code"></div><div class="name"></div><div class="price"></div>';
  const codeEl = b.querySelector('.code');
  const nameEl = b.querySelector('.name');
  codeEl.textContent = s.code;
  nameEl.textContent = s.name;
  b.querySelector('.price').textContent = s.price;
  b.onclick = () => {
    if (!s.code) return;
    selectedCode = s.code;
    document.querySelectorAll('.set-card').forEach(c => c.classList.remove('active'));
    b.classList.add('active');
    update();
  };

  const fields = document.createElement('div');
  fields.className = 'set-fields';

  const codeInput = document.createElement('input');
  codeInput.className = 'code-input';
  codeInput.type = 'text';
  codeInput.value = s.code;
  codeInput.addEventListener('input', () => {
    const oldCode = s.code;
    s.code = codeInput.value.trim();
    codeInput.classList.toggle('invalid', !s.code);
    codeEl.textContent = s.code;
    // se il codice sparisce, sparisce anche il link: mai lasciarne uno vecchio in giro
    if (selectedCode === oldCode) selectedCode = s.code;
    if (!s.code) b.classList.remove('active');
    saveSets();
    refreshSetLabels();
    update();
  });

  const nameInput = document.createElement('input');
  nameInput.className = 'name-input';
  nameInput.type = 'text';
  nameInput.value = s.name;
  nameInput.addEventListener('input', () => {
    s.name = nameInput.value.trim();
    nameInput.classList.toggle('invalid', !s.name);
    nameEl.textContent = s.name;
    saveSets();
    refreshSetLabels();
    update();
  });

  fields.appendChild(codeInput);
  fields.appendChild(nameInput);
  item.appendChild(b);
  item.appendChild(fields);
  $('sets').appendChild(item);
  setRows.push({ s, b, codeInput, nameInput });
});

function refreshSetLabels() {
  setRows.forEach(({ s, codeInput, nameInput }) => {
    codeInput.placeholder = t('codePh');
    nameInput.placeholder = t('namePh');
    codeInput.setAttribute('aria-label', `${t('codeLabel')}: ${s.name || s.code}`);
    nameInput.setAttribute('aria-label', `${t('nameLabel')}: ${s.code || s.name}`);
  });
}

// --- ripristino dei valori originali ---
$('restoreBtn').onclick = () => {
  setRows.forEach(({ s, b, codeInput, nameInput }, i) => {
    const wasSelected = selectedCode === s.code;
    s.code = SETS_DEFAULT[i].code;
    s.name = SETS_DEFAULT[i].name;
    codeInput.value = s.code;
    nameInput.value = s.name;
    codeInput.classList.remove('invalid');
    nameInput.classList.remove('invalid');
    b.querySelector('.code').textContent = s.code;
    b.querySelector('.name').textContent = s.name;
    if (wasSelected) selectedCode = s.code;
  });
  saveSets();
  refreshSetLabels();
  update();
};

// --- store select ---
const sel = $('store');
function buildStoreSelect() {
  const keep = sel.value;
  sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = t('selectStore');
  sel.appendChild(ph);
  STORES.forEach(g => {
    const og = document.createElement('optgroup');
    og.label = lang === 'it' ? g.gIt : g.gEn;
    g.items.forEach(([loc, itLabel, enLabel]) => {
      const o = document.createElement('option');
      o.value = loc;
      o.textContent = `${lang === 'it' ? itLabel : enLabel} — ${loc}`;
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  sel.value = keep || 'it-it';
  if (!sel.value) sel.value = 'it-it';
}
sel.onchange = update;

function cartLink(loc, code) {
  return `https://www.lego.com/${loc}/cart?product=${encodeURIComponent(code)}`;
}

function storeName(loc) {
  for (const g of STORES) for (const [l, itL, enL] of g.items) if (l === loc) return lang === 'it' ? itL : enL;
  return loc;
}

function setName(code) {
  const s = SETS.find(x => x.code === code);
  return s ? `${code} ${s.name}` : code;
}

function update() {
  const loc = sel.value;
  if (selectedCode && loc) {
    $('result').classList.add('show');
    $('resSet').textContent = setName(selectedCode);
    $('resStore').textContent = storeName(loc);
    $('link').textContent = cartLink(loc, selectedCode);
    $('openBtn').href = cartLink(loc, selectedCode);
    resetBtn($('copyBtn'), t('copy'));
    $('openBtn').textContent = t('open');
  } else {
    $('result').classList.remove('show');
  }
  if (loc) {
    $('allSets').classList.add('show');
    $('allTitle').textContent = t('allTitle');
    const list = $('allList');
    list.innerHTML = '';
    SETS.filter(s => s.code).forEach(s => {
      const url = cartLink(loc, s.code);
      const row = document.createElement('div');
      row.className = 'mini-row glass-panel';
      const info = document.createElement('div');
      info.className = 'info';
      const title = document.createElement('div');
      title.className = 't';
      title.textContent = s.name ? `${s.code} · ${s.name}` : s.code;
      const urlEl = document.createElement('div');
      urlEl.className = 'u';
      urlEl.textContent = url;
      info.appendChild(title);
      info.appendChild(urlEl);
      row.appendChild(info);
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'mini-btn';
      btn.textContent = t('copyMini');
      btn.onclick = () => copyText(url, btn, t('copyMini'));
      row.appendChild(btn);
      list.appendChild(row);
    });
    resetBtn($('copyAllBtn'), t('copyAll'));
  } else {
    $('allSets').classList.remove('show');
  }
}

function copyText(text, btn, restoreLabel) {
  const done = () => {
    const old = restoreLabel || btn.textContent;
    btn.classList.add('copied');
    btn.textContent = t('copied');
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = old; }, 1600);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) done(); else prompt(t('manualCopy'), text);
}

function resetBtn(btn, label) {
  btn.classList.remove('copied');
  btn.textContent = label;
}

$('copyBtn').onclick = () => copyText($('link').textContent, $('copyBtn'), t('copy'));
$('copyAllBtn').onclick = () => {
  const loc = sel.value;
  if (!loc) return;
  const txt = SETS.filter(s => s.code)
    .map(s => `${s.code} ${s.name}\n${cartLink(loc, s.code)}`.trim())
    .join('\n\n');
  copyText(txt, $('copyAllBtn'), t('copyAll'));
};

// --- init ---
const savedTheme = store.get('bdp6-theme');
applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
applyLang(lang);
$('restoreBtn').hidden = !isEdited();
</script>
</body>
</html>
